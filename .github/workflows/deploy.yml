name: Check and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: Validate Worker bundle (no deployment)
        run: npx wrangler deploy --dry-run --outdir .wrangler/check

  deploy:
    name: Deploy production
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.D1_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.APP_URL }}
    concurrency:
      group: production-deployment
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prepare production configuration
        run: node scripts/production-config.mjs
        env:
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          APP_URL: ${{ vars.APP_URL }}
          TIMEZONE: ${{ vars.TIMEZONE }}
          PUBLIC_REPORTS: ${{ vars.PUBLIC_REPORTS }}
          CF_ACCESS_TEAM_DOMAIN: ${{ vars.CF_ACCESS_TEAM_DOMAIN }}
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          OWNER_EMAIL: ${{ vars.OWNER_EMAIL }}
          KIMI_BASE_URL: ${{ vars.KIMI_BASE_URL }}
          KIMI_MODEL: ${{ vars.KIMI_MODEL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Apply database migrations
        run: npx wrangler d1 migrations apply DB --remote --config .wrangler.production.generated.json
      - name: Publish Worker, assets and secrets together
        run: npx wrangler deploy --config .wrangler.production.generated.json --secrets-file .secrets.production.generated.json
      - name: Check deployed service
        run: node scripts/check-deployment.mjs
        env:
          APP_URL: ${{ vars.APP_URL }}
      - name: Remove temporary secret files
        if: always()
        run: rm -f .secrets.production.generated.json .wrangler.production.generated.json
